name: Claims ML tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scikit-learn scipy joblib pytest
      - name: Run tests with synthetic claims only
        run: python -m pytest -q
